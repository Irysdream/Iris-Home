<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#39C5BB">
  <meta name="google" content="notranslate">
  <title>搜索 - Iris Home</title>

  <link rel="shortcut icon" type="image/ico" href="https://cdn.jsdelivr.net/gh/alist-org/logo@main/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    *:not([class*=icon]):not(i) {
      font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      font-weight: 700;
    }

    /* 禁止文字框选（输入框、链接除外） */
    body, body * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    input, textarea, [contenteditable="true"] {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }
    a, a * {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-image: url('https://r2.sharelikes.com.cn/Yuru-Camp-Blur.webp');
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      background-position: 50% 50%;
      color: #39C5BB;
      min-height: 100vh;
      position: relative;
    }

    /* Results frame 无导航，直接全屏 */
    .results-wrap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .results-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .corner-img {
      position: fixed;
      bottom: 18px;
      right: 18px;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      z-index: 100;
      border: 2px solid rgba(255, 255, 255, 0.7);
      background: #fff;
      transition: transform 0.2s ease;
    }
    .corner-img:hover { transform: scale(1.12); }

    .fallback {
      display: none;
      padding: 40px 24px;
      text-align: center;
      color: #2a6b66;
    }
    .fallback a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background: #39C5BB;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
    }

    @media (max-width: 700px) {
    }
  </style>
</head>
<body>
  <!-- 导航栏已完全删除 -->

  <div class="results-wrap" id="resultsWrap">
    <iframe class="results-frame" id="resultsFrame" title="搜索结果" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
    <div class="fallback" id="fallback">
      <p>若结果未能嵌入显示，可直接打开 Bing 完整结果页</p>
      <a id="openBing" href="#" target="_blank" rel="noopener">在新标签页打开搜索结果</a>
    </div>
  </div>

  <img class="corner-img" src="./iris.png" alt="Iris" title="Iris">

  <div id="musicPlayerContainer"></div>
  <script>
    (function() {
      const autoplay = localStorage.getItem("iris_music_autoplay") === "1";
      const script = document.createElement("script");
      script.id = "myhk";
      script.src = "https://myhkw.cn/api/player/166299859651";
      script.setAttribute("key", "166299859651");
      script.setAttribute("m", "1");
      script.setAttribute("au", autoplay ? "1" : "0");
      script.setAttribute("skin", "player");
      script.setAttribute("lr", "r");
      script.defer = true;
      document.body.appendChild(script);
    })();
  </script>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const q = (params.get('q') || '').trim();
      const frame = document.getElementById('resultsFrame');
      const fallback = document.getElementById('fallback');
      const openBing = document.getElementById('openBing');

      if (!q) {
        frame.style.display = 'none';
        fallback.style.display = 'block';
        openBing.style.display = 'none';
        fallback.querySelector('p').textContent = '请输入关键词后搜索';
        return;
      }

      // Bing 搜索结果
      const bingUrl = 'https://www.bing.com/search?q=' + encodeURIComponent(q);
      openBing.href = bingUrl;
      frame.src = bingUrl;

      frame.addEventListener('load', function () {
      });

      setTimeout(function () {
        fallback.style.display = 'block';
        fallback.style.position = 'absolute';
        fallback.style.bottom = '24px';
        fallback.style.left = '0';
        fallback.style.right = '0';
        fallback.style.padding = '12px';
        fallback.style.background = 'rgba(255,255,255,0.9)';
      }, 2500);
    })();
  </script>
</body>
</html>
